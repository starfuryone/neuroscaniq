version: "3.9"

# =============================================================
# NeuroScanIQ — Local development stack
# =============================================================
# NOTE: Postgres runs as a STANDALONE container (nsiq-postgres) outside
# this compose file, on 127.0.0.1:5433. See README for the docker run cmd.
# =============================================================

services:
  # ---------- Data plane ----------
  # postgres service removed -- using standalone nsiq-postgres container

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - cluster.name=neuroscaniq-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_SCREENSHOTS:-screenshots} &&
      mc mb --ignore-existing local/${S3_BUCKET_EXPORTS:-exports} &&
      mc anonymous set download local/${S3_BUCKET_SCREENSHOTS:-screenshots};
      exit 0;
      "

  # ---------- Application plane ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  worker-scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: scanner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.runner", "--queue", "scanner"]
    volumes:
      - ./backend:/app
    restart: unless-stopped
    deploy:
      replicas: 2

  worker-screenshot:
    build:
      context: ./backend
      dockerfile: Dockerfile.screenshot
    env_file: .env
    environment:
      WORKER_TYPE: screenshot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["python", "-m", "app.workers.runner", "--queue", "screenshot"]
    volumes:
      - ./backend:/app
    shm_size: 1gb
    restart: unless-stopped

  worker-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: monitor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.runner", "--queue", "monitor"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  worker-alert:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: alert
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.runner", "--queue", "alert"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  redisdata:
  opensearchdata:
  miniodata:

networks:
  default:
    name: neuroscaniq-net
