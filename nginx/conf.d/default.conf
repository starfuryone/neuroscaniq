# NeuroScanIQ -- edge proxy
# - HTTP -> HTTPS redirect (when TLS is configured)
# - Static + Next.js front-end on :3000
# - FastAPI backend on :8000 (mounted at /api/*)

upstream nsiq_api {
  server api:8000;
  keepalive 32;
}

upstream nsiq_front {
  server frontend:3000;
  keepalive 32;
}

# ---------- HTTP (port 80) ----------
# In dev compose this is the only listener. In prod, Let's Encrypt certbot
# challenges go here and everything else redirects to HTTPS.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # ACME challenge passthrough for certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Uncomment in prod once a certificate exists:
  # location / { return 301 https://$host$request_uri; }

  # ---- shared proxy headers ----
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID      $request_id;

  # Stripe webhook -- must NOT be rate-limited (Stripe retries are bursty).
  location = /api/v1/billing/webhook {
    proxy_pass http://nsiq_api;
    proxy_read_timeout 30s;
  }

  # Auth endpoints: tighter limit, no caching.
  location ~ ^/api/v1/auth/ {
    limit_req zone=auth_limit burst=20 nodelay;
    proxy_pass http://nsiq_api;
  }

  # General API
  location /api/ {
    limit_req zone=api_limit burst=120 nodelay;
    proxy_pass http://nsiq_api;
    proxy_read_timeout 60s;
  }

  # Health check passthrough (no rate limit)
  location = /health {
    proxy_pass http://nsiq_api/health;
    access_log off;
  }

  # Front-end (Next.js)
  location / {
    proxy_pass http://nsiq_front;
    proxy_read_timeout 60s;
  }

  # ---- security headers (applied to all responses) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP intentionally permissive for the SPA; tighten per environment.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://api.anthropic.com https://api.stripe.com;" always;
}

