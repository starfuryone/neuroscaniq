name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: backend / lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check app tests

      - name: mypy
        run: mypy app --ignore-missing-imports || true   # advisory, not blocking yet

      - name: pytest
        env:
          JWT_SECRET: "x_test_secret_must_be_long_enough_for_validation_xxxxxxxxxxxx"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/15"
          OPENSEARCH_URL: "http://localhost:9200"
          ENV: "test"
          ALLOWED_SCAN_CIDRS: "203.0.113.0/24"
        run: pytest -q

  frontend:
    name: frontend / lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --silent || true   # advisory until lockfile lands

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          API_BASE_URL: "http://localhost:8000"
        run: npm run build

  docker_images:
    name: docker / build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: neuroscaniq/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: neuroscaniq/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
