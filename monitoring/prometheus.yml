global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "neuroscaniq-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: "neuroscaniq-workers"
    static_configs:
      - targets:
          - "worker-scanner:9100"
          - "worker-monitor:9100"
          - "worker-alert:9100"
        labels:
          service: worker
